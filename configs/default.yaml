# Default configuration. Every threshold lives here, never hard-coded in source,
# so a ward can be re-tuned without a code change.

source: "webcam://0"

pose:
  # Which PoseEstimator implementation to use. The model is a config line so the
  # pose bake-off (rtmo / yolo / rtmpose) is a swap, not a rewrite.
  backend: "rtmo"
  model_input_size: [640, 640]
  # onnxruntime + cpu is ~210 ms/frame (about 5 fps) on a laptop CPU: fine for
  # development, too slow for a live demo. Faster combinations:
  #   onnxruntime + cuda   NVIDIA GPU -- the same path the Jetson uses
  #   openvino    + gpu    Intel iGPU / Arc -- the fast option on this laptop
  #   openvino    + npu    Intel Core Ultra NPU
  # Each needs its own extra package installed.
  runtime: "onnxruntime" # "onnxruntime" | "openvino" | "opencv"
  device: "cpu"          # see the table above
  min_score: 0.3         # per-person detection confidence floor
  min_keypoint_score: 0.3

smoothing:
  # One-Euro filter per keypoint. Raw keypoint jitter of a few pixels becomes
  # phantom vertical velocity downstream, so this is load-bearing, not cosmetic.
  enabled: true
  min_cutoff: 1.0
  beta: 0.007
  d_cutoff: 1.0

view:
  # "skeleton" renders joints on black -- this is the privacy demo: what you see
  # is all the system retains. "none" runs headless.
  mode: "skeleton"
  show_bbox: false
  show_ids: true
  show_fps: true

dashboard:
  host: "127.0.0.1"      # localhost only -- not exposed to the ward network
  port: 8000
  show_rgb: false        # skeleton-only by default; --rgb needs AH/DPO sign-off
  jpeg_quality: 90
  # Cameras the page offers in its picker. A connected RealSense is appended
  # automatically; nothing else is probed, because scanning webcam indices is
  # slow and can grab a device another program is already using.
  sources:
    - label: "Laptop webcam"
      uri: "webcam://0"
  # backends: []         # empty offers all of rtmo / rtmpose / yolo
  allow_custom_source: true   # the free-text URI box on the page
  switch_timeout_s: 5.0       # how long to wait for a camera to be released

privacy:
  # Raw frame capture is for consented staged-fall sessions only. All three of
  # this flag, AHFD_ALLOW_RAW=1, and --i-understand-raw-capture must agree.
  allow_raw_capture: false
